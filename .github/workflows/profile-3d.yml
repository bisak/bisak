name: GitHub-Profile-3D-Contrib

on:
  schedule: # 03:00 Sofia (EEST) == 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Remove radar and language charts
        # GitHub hides org private-repo details, so these charts only reflect public commits
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          NS = "http://www.w3.org/2000/svg"
          ET.register_namespace("", NS)
          for path in glob.glob("profile-3d-contrib/*.svg"):
              tree = ET.parse(path)
              root = tree.getroot()
              groups = [c for c in root if c.tag == f"{{{NS}}}g"]
              # v0.9.3 layout: 3D calendar, radar, language pie, totals
              assert len(groups) == 4, (path, len(groups))
              for g in groups[1:3]:
                  root.remove(g)
              tree.write(path, encoding="unicode")
          PY
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "generated"; then
            git push
          fi
